  <body>
    <!-- Apply the saved theme before first paint. Night (dark) is the
         default; day mode is opt-in and remembered once chosen. -->
    <script>
      (function () {
        var night = true;
        try {
          night = localStorage.getItem("drift-theme") !== "light";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", night);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
